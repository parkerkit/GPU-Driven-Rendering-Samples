exclude: ^third_party/

repos:
  - repo: local
    hooks:
      - id: clang-format
        name: Clang Format
        entry: clang-format -i --style=file
        language: system
        files: \.(c|cpp|h|hpp|cc|cxx)$
        require_serial: true

      - id: text-style-check
        name: Normalize Text Style And Line Endings
        entry: python hooks/text_style_check.py
        language: system
        stages: [pre-commit]
        types: [text]

      - id: utf8-check
        name: Check UTF-8 without BOM / ASCII
        entry: python hooks/utf8_check.py
        language: system
        stages: [pre-commit]
        types: [text]

      - id: clang-tidy-check
        name: Run Clang-Tidy
        entry: python hooks/clang_tidy_check.py
        language: system
        files: \.(c|cpp|h|hpp|cc|cxx)$
        require_serial: true
        verbose: true

      - id: validate-config-files
        name: Validate JSON and YAML
        entry: python hooks/validate_config_files.py
        language: system
        files: \.(json|yml|yaml)$

      - id: check-large-files
        name: Check Large Files
        entry: python hooks/check_large_files.py
        language: system
        stages: [pre-commit]
        pass_filenames: true
